name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile
        run: mvn -B -q clean compile

      # C1 执行级验证依赖无头浏览器。安装 chromium 让运行时验证能在 CI 真跑；
      # 若受环境限制装不上，验证器会自动降级为仅静态校验（SKIPPED），不影响构建。
      - name: Install headless browser (Chromium)
        working-directory: .
        continue-on-error: true
        run: npx -y playwright@1.62.1 install --with-deps chromium

      # 测试类覆盖 Agent 编排、HTML 校验器、模型路由、Token 计量、数据层，以及 C1 运行时验证策略。
      # MockLlmProvider 让测试无需真实模型调用即可跑通自检修复闭环。
      - name: Unit tests
        run: mvn -B test

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check & build
        run: npm run build

  bundle-guard:
    name: Backend · bundle size guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 可执行 jar 体积护栏：Agent 服务端除模型权重外不应携带大体积资源，
      # 体积异常通常意味着误提交了模型文件或演示数据。
      - name: Package without tests
        run: mvn -B -q package -DskipTests

      - name: Check jar size
        run: |
          JAR=$(ls target/*.jar | grep -v original | head -1)
          SIZE=$(stat -c%s "$JAR")
          LIMIT=$((80 * 1024 * 1024))
          echo "jar: $JAR  size: $SIZE bytes (limit ${LIMIT})"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "FAIL: 可执行 jar 超过 80MB 预算，请检查是否误提交模型或数据文件"
            exit 1
          fi