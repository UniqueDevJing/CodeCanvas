name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile
        run: mvn -B -q clean compile

      # C1 执行级验证依赖无头浏览器。安装 chromium 让运行时验证能在 CI 真跑；
      # 若受环境限制装不上，验证器会自动降级为仅静态校验（SKIPPED），不影响构建。
      - name: Install headless browser (Chromium)
        working-directory: .
        continue-on-error: true
        run: npx -y playwright@1.62.1 install --with-deps chromium

      # 测试类覆盖 Agent 编排、HTML 校验器、模型路由、Token 计量、数据层，以及 C1 运行时验证策略。
      # MockLlmProvider 让测试无需真实模型调用即可跑通自检修复闭环。
      - name: Unit tests
        run: mvn -B test

  visual-gateway:
    name: Visual gateway · contract & semantics
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: visual-gateway/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      # W1：网关的契约(响应字段集)、语义(幂等/取消/超时/假成功)、安全(伪造类提示词拒绝)
      # 全部是纯逻辑，不需要 GPU 也不需要真 ComfyUI；真后端只用 httpx.MockTransport 验报文形状。
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend · build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Unit tests (vitest · reducer / SSE / useAgentStream)
        run: npm test

      - name: Type check & build
        run: npm run build

  e2e:
    name: E2E · browser full-loop (offline engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 离线引擎模式：不配模型 Key，后端自动降级为 MOCK 引擎
      # （/api/config 返回 llmMode=MOCK，界面明示），E2E 全链路仍然真实可跑。
      - name: Package backend
        working-directory: backend
        run: mvn -B -q package -DskipTests

      - name: Start backend
        run: |
          nohup java -jar backend/target/codecanvas-backend.jar --codecanvas.api.key=e2e-ci-key --server.port=8080 > backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -H "X-API-Key: e2e-ci-key" http://localhost:8080/api/config > /dev/null && echo "backend ready" && break
            sleep 2
          done
          curl -sf -H "X-API-Key: e2e-ci-key" http://localhost:8080/api/config | grep -o '"llmMode":"[A-Z]*"'

      - name: Start frontend dev server
        run: |
          cd frontend
          npm ci
          VITE_API_KEY=e2e-ci-key nohup npm run dev -- --port 3000 > ../frontend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && echo "frontend ready" && break
            sleep 2
          done

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E (generate → cancel → rollback → deploy)
        working-directory: frontend
        env:
          CODECANVAS_E2E: '1'
          CODECANVAS_API_KEY: e2e-ci-key
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  dependency-scan:
    name: Dependencies · OSS Index audit (CVSS>=7 fails)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 轻量漏洞扫描：OSS Index 在线漏洞库（不需要下载 NVD 全量库）。
      # 门禁：CVSS>=7 即失败（高危无豁免不合并）。匿名请求可能限流，重试 3 次。
      - name: OSS Index audit
        run: |
          for i in 1 2 3; do
            mvn -B org.sonatype.ossindex.maven:ossindex-maven-plugin:3.2.0:audit -Dossindex.cvssScoreThreshold=7 && exit 0
            echo "attempt $i failed (可能是匿名限流), retrying in 30s..."
            sleep 30
          done
          exit 1

  bundle-guard:
    name: Backend · bundle size guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 可执行 jar 体积护栏：Agent 服务端除模型权重外不应携带大体积资源，
      # 体积异常通常意味着误提交了模型文件或演示数据。
      - name: Package without tests
        run: mvn -B -q package -DskipTests

      - name: Check jar size
        run: |
          JAR=$(ls target/*.jar | grep -v original | head -1)
          SIZE=$(stat -c%s "$JAR")
          LIMIT=$((80 * 1024 * 1024))
          echo "jar: $JAR  size: $SIZE bytes (limit ${LIMIT})"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "FAIL: 可执行 jar 超过 80MB 预算，请检查是否误提交模型或数据文件"
            exit 1
          fi