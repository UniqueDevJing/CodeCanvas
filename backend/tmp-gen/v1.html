<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易记账本 - 月度统计</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --light-bg: #ecf0f1;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-radius: 8px;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        /* 布局网格 */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--light-bg);
            padding-bottom: 10px;
        }

        .card-title {
            font-size: 1.2em;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 表单区域 */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--primary-color);
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            cursor: pointer;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
            padding: 5px 10px;
            font-size: 0.85em;
        }

        .btn-export {
            background-color: var(--success-color);
            color: white;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: var(--light-bg);
            border-radius: var(--border-radius);
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 5px;
        }

        .stat-value.income { color: var(--success-color); }
        .stat-value.expense { color: var(--danger-color); }

        /* 表格样式 */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .amount {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
        }

        .income-text { color: var(--success-color); }
        .expense-text { color: var(--danger-color); }

        /* 图表容器 */
        .chart-container {
            height: 300px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 20px 0;
            border-bottom: 1px solid #ecf0f1;
        }

        .bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 12%;
            max-width: 80px;
        }

        .bar {
            width: 100%;
            background-color: var(--accent-color);
            border-radius: 4px 4px 0 0;
            transition: height 0.5s ease;
            position: relative;
            min-height: 2px;
        }

        .bar:hover {
            background-color: #2980b9;
        }

        .bar-label {
            margin-top: 10px;
            font-size: 0.85em;
            text-align: center;
            color: #7f8c8d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .bar-value {
            position: absolute;
            top: -25px;
            width: 100%;
            text-align: center;
            font-size: 0.8em;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 筛选器 */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-style: italic;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .actions button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>简易记账本</h1>
            <div class="subtitle">记录日常收支 · 分析月度消费</div>
        </header>

        <!-- 统计概览 -->
        <div class="dashboard">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">本月统计</span>
                    <span id="currentMonthDisplay" style="color: #7f8c8d; font-size: 0.9em;"></span>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">总收入</div>
                        <div class="stat-value income" id="totalIncome">0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">总支出</div>
                        <div class="stat-value expense" id="totalExpense">0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">结余</div>
                        <div class="stat-value" id="netBalance">0.00</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">支出分类占比</span>
                </div>
                <div class="chart-container" id="chartContainer">
                    <div class="empty-state">暂无数据，添加记录后查看统计</div>
                </div>
            </div>
        </div>

        <!-- 操作区域 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">添加新记录</span>
            </div>
            <form id="transactionForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">日期</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="type">类型</label>
                        <select id="type" required onchange="updateCategoryOptions()">
                            <option value="income">收入</option>
                            <option value="expense" selected>支出</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="amount">金额</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">分类</label>
                        <select id="category" required>
                            <!-- 选项将通过JS动态生成 -->
                        </select>
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label for="note">备注</label>
                        <input type="text" id="note" placeholder="描述这笔交易...">
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button type="submit" class="btn-primary">添加记录</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 数据管理与列表 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">交易记录</span>
                <div class="actions">
                    <button class="btn-secondary" onclick="exportData()">导出 CSV</button>
                    <button class="btn-primary" style="background-color: #7f8c8d;" onclick="importData()">导入 CSV</button>
                </div>
            </div>
            
            <div class="filters">
                <div class="filter-group">
                    <label for="filterMonth">筛选月份</label>
                    <input type="month" id="filterMonth" onchange="renderTable()">
                </div>
                <div class="filter-group">
                    <label for="filterType">类型</label>
                    <select id="filterType" onchange="renderTable()">
                        <option value="all">全部</option>
                        <option value="income">收入</option>
                        <option value="expense">支出</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="searchText">搜索</label>
                    <input type="text" id="searchText" placeholder="备注/分类..." oninput="renderTable()">
                </div>
            </div>

            <div class="table-container">
                <table id="transactionTable">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>类型</th>
                            <th>分类</th>
                            <th>备注</th>
                            <th>金额</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- 行将通过JS插入 -->
                    </tbody>
                </table>
                <div id="emptyTable" class="empty-state" style="display: none;">当前条件下暂无记录</div>
            </div>
        </div>
    </div>

    <script>
        // 配置与常量
        const CATEGORIES = {
            income: ['工资', '奖金', '投资收益', '兼职', '其他收入'],
            expense: ['餐饮', '交通', '住房', '水电煤', '购物', '娱乐', '医疗', '教育', '其他支出']
        };

        // 存储管理
        const StorageManager = {
            data: [],
            storageKey: 'finance_app_data_v1',
            
            init() {
                try {
                    const stored = localStorage.getItem(this.storageKey);
                    if (stored) {
                        this.data = JSON.parse(stored);
                    }
                } catch (e) {
                    console.warn('LocalStorage不可用，使用内存存储', e);
                    // 降级方案：使用内存存储
                    this.data = [];
                }
                
                // 如果没有数据，初始化一些示例数据
                if (this.data.length === 0) {
                    this.data = [
                        { id: 1, date: new Date().toISOString().split('T')[0], type: 'income', category: '工资', amount: 12000, note: '本月工资' },
                        { id: 2, date: new Date().toISOString().split('T')[0], type: 'expense', category: '餐饮', amount: 45.50, note: '午餐' },
                        { id: 3, date: new Date().toISOString().split('T')[0], type: 'expense', category: '交通', amount: 30, note: '地铁充值' }
                    ];
                    this.save();
                }
            },

            save() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.data));
                } catch (e) {
                    console.error('保存失败', e);
                }
            },

            add(record) {
                record.id = Date.now();
                this.data.unshift(record); // 新记录放在最前
                this.save();
            },

            update(id, newData) {
                const index = this.data.findIndex(item => item.id === id);
                if (index !== -1) {
                    this.data[index] = { ...this.data[index], ...newData };
                    this.save();
                }
            },

            delete(id) {
                this.data = this.data.filter(item => item.id !== id);
                this.save();
            },

            getData() {
                return this.data;
            }
        };

        // 工具函数
        const Utils = {
            formatCurrency(amount) {
                return '¥' + parseFloat(amount).toFixed(2);
            },
            getCurrentMonthString() {
                const d = new Date();
                return `${d.getFullYear()}年${d.getMonth() + 1}月`;
            },
            getMonthString(dateStr) {
                const d = new Date(dateStr);
                return `${d.getFullYear()}年${d.getMonth() + 1}月`;
            },
            getCurrentMonthFilter() {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            }
        };

        // UI 渲染逻辑
        const UI = {
            init() {
                // 初始化日期控件默认值为今天
                document.getElementById('date').valueAsDate = new Date();
                
                // 初始化筛选器默认值为本月
                document.getElementById('filterMonth').value = Utils.getCurrentMonthFilter();
                
                // 初始化分类下拉框
                this.updateCategoryOptions();
                
                // 渲染初始数据
                this.renderStats();
                this.renderChart();
                this.renderTable();
                
                // 设置表头月份显示
                document.getElementById('currentMonthDisplay').innerText = Utils.getCurrentMonthString();
            },

            updateCategoryOptions() {
                const type = document.getElementById('type').value;
                const categorySelect = document.getElementById('category');
                const categories = CATEGORIES[type];
                
                categorySelect.innerHTML = '';
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.innerText = cat;
                    categorySelect.appendChild(option);
                });
            },

            renderStats() {
                const data = StorageManager.getData();
                const currentMonth = Utils.getCurrentMonthFilter();
                
                let income = 0;
                let expense = 0;

                data.forEach(item => {
                    if (item.date.startsWith(currentMonth)) {
                        if (item.type === 'income') income += parseFloat(item.amount);
                        else expense += parseFloat(item.amount);
                    }
                });

                document.getElementById('totalIncome').innerText = Utils.formatCurrency(income);
                document.getElementById('totalExpense').innerText = Utils.formatCurrency(expense);
                document.getElementById('netBalance').innerText = Utils.formatCurrency(income - expense);
            },

            renderChart() {
                const chartContainer = document.getElementById('chartContainer');
                const data = StorageManager.getData();
                const currentMonth = Utils.getCurrentMonthFilter();

                // 过滤本月数据
                const monthlyData = data.filter(item => item.date.startsWith(currentMonth) && item.type === 'expense');
                
                // 分类统计
                const stats = {};
                monthlyData.forEach(item => {
                    stats[item.category] = (stats[item.category] || 0) + parseFloat(item.amount);
                });

                // 转换为数组并排序
                const chartData = Object.entries(stats)
                    .map(([category, amount]) => ({ category, amount }))
                    .sort((a, b) => b.amount - a.amount);

                if (chartData.length === 0) {
                    chartContainer.innerHTML = '<div class="empty-state">暂无支出数据，无法生成图表</div>';
                    return;
                }

                // 找出最大值用于计算比例
                const maxAmount = Math.max(...chartData.map(d => d.amount));
                
                let html = '';
                chartData.forEach(item => {
                    const heightPercentage = maxAmount > 0 ? (item.amount / maxAmount) * 100 : 0;
                    html += `
                        <div class="bar-group">
                            <div class="bar-value">${Utils.formatCurrency(item.amount)}</div>
                            <div class="bar" style="height: ${Math.max(heightPercentage, 5)}%"></div>
                            <div class="bar-label" title="${item.category}">${item.category}</div>
                        </div>
                    `;
                });

                chartContainer.innerHTML = html;
            },

            renderTable() {
                const tableBody = document.getElementById('tableBody');
                const emptyState = document.getElementById('emptyTable');
                const data = StorageManager.getData();
                
                const filterMonth = document.getElementById('filterMonth').value;
                const filterType = document.getElementById('filterType').value;
                const searchText = document.getElementById('searchText').value.toLowerCase();

                let filteredData = data.filter(item => {
                    // 日期筛选
                    const matchDate = filterMonth ? item.date.startsWith(filterMonth) : true;
                    // 类型筛选
                    const matchType = filterType === 'all' || item.type === filterType;
                    // 文本搜索
                    const matchSearch = item.note.toLowerCase().includes(searchText) || 
                                        item.category.toLowerCase().includes(searchText);
                    
                    return matchDate && matchType && matchSearch;
                });

                if (filteredData.length === 0) {
                    tableBody.innerHTML = '';
                    emptyState.style.display = 'block';
                    return;
                }

                emptyState.style.display = 'none';

                let html = '';
                filteredData.forEach(item => {
                    const isIncome = item.type === 'income';
                    const amountClass = isIncome ? 'income-text' : 'expense-text';
                    const amountSign = isIncome ? '+' : '-';
                    
                    html += `
                        <tr>
                            <td>${item.date}</td>
                            <td>
                                <span style="padding: 2px 6px; border-radius: 4px; font-size: 0.8em; background-color: ${isIncome ? '#d5f5e3' : '#fadbd8'}; color: ${isIncome ? '#27ae60' : '#e74c3c'}">
                                    ${isIncome ? '收入' : '支出'}
                                </span>
                            </td>
                            <td>${item.category}</td>
                            <td>${item.note}</td>
                            <td class="amount ${amountClass}">${amountSign}${Utils.formatCurrency(item.amount)}</td>
                            <td>
                                <button class="btn-danger" onclick="editTransaction(${item.id})">编辑</button>
                                <button class="btn-danger" style="margin-left:5px; background-color: #95a5a6;" onclick="deleteTransaction(${item.id})">删</button>
                            </td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = html;
            }
        };

        // 交互逻辑
        const App = {
            init() {
                StorageManager.init();
                UI.init();

                // 绑定表单提交
                document.getElementById('transactionForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addTransaction();
                });
            },

            addTransaction() {
                const date = document.getElementById('date').value;
                const type = document.getElementById('type').value;
                const category = document.getElementById('category').value;
                const amount = parseFloat(document.getElementById('amount').value);
                const note = document.getElementById('note').value;

                if (!date || !category || isNaN(amount) || amount <= 0) {
                    alert('请正确填写所有必填项');
                    return;
                }

                StorageManager.add({
                    date,
                    type,
                    category,
                    amount,
                    note
                });

                // 重置表单
                document.getElementById('amount').value = '';
                document.getElementById('note').value = '';
                document.getElementById('date').valueAsDate = new Date();
                
                // 更新界面
                UI.renderStats();
                UI.renderChart();
                UI.renderTable();
            },

            deleteTransaction(id) {
                if (confirm('确定要删除这条记录吗？')) {
                    StorageManager.delete(id);
                    UI.renderStats();
                    UI.renderChart();
                    UI.renderTable();
                }
            },

            editTransaction(id) {
                const data = StorageManager.getData();
                const record = data.find(item => item.id === id);
                if (!record) return;

                // 填充表单
                document.getElementById('date').value = record.date;
                document.getElementById('type').value = record.type;
                document.getElementById('category').value = record.category;
                document.getElementById('amount').value = record.amount;
                document.getElementById('note').value = record.note;
                
                // 更新分类选项以匹配选中的类型
                UI.updateCategoryOptions();

                // 修改提交逻辑为更新
                const form = document.getElementById('transactionForm');
                form.onsubmit = (e) => {
                    e.preventDefault();
                    const newRecord = {
                        date: document.getElementById('date').value,
                        type: document.getElementById('type').value,
                        category: document.getElementById('category').value,
                        amount: parseFloat(document.getElementById('amount').value),
                        note: document.getElementById('note').value
                    };
                    
                    StorageManager.update(id, newRecord);
                    
                    // 恢复添加模式
                    form.onsubmit = (ev) => {
                        ev.preventDefault();
                        this.addTransaction();
                    };
                    
                    UI.renderStats();
                    UI.renderChart();
                    UI.renderTable();
                    alert('记录已更新');
                };
                
                // 滚动到表单
                form.scrollIntoView({ behavior: 'smooth' });
            }
        };

        // 导出功能
        function exportData() {
            const data = StorageManager.getData();
            if (data.length === 0) {
                alert('没有数据可导出');
                return;
            }

            // 构建CSV内容
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "日期,类型,分类,备注,金额\n";

            data.forEach(row => {
                const rowArr = [
                    row.date,
                    row.type === 'income' ? '收入' : '支出',
                    row.category,
                    `"${row.note}"`, // 备注可能包含逗号，用引号包裹
                    row.amount
                ];
                csvContent += rowArr.join(",") + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `记账本_${Utils.getCurrentMonthString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 导入功能
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv';
            
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const text = event.target.result;
                    try {
                        const lines = text.split('\n');
                        // 跳过表头
                        const dataLines = lines.slice(1).filter(line => line.trim() !== '');
                        
                        let importedCount = 0;
                        dataLines.forEach(line => {
                            // 简单的CSV解析，处理引号内的逗号
                            const regex = /,(?=(?:[^"]*"[^"]*")*[^"]*$)/;
                            const cols = line.split(regex);
                            
                            if (cols.length >= 4) {
                                const type = cols[1].trim() === '收入' ? 'income' : 'expense';
                                const amount = parseFloat(cols[4]);
                                
                                if (!isNaN(amount)) {
                                    StorageManager.add({
                                        date: cols[0].trim(),
                                        type: type,
                                        category: cols[2].trim(),
                                        note: cols[3].replace(/^"|"$/g, '').trim(), // 去除引号
                                        amount: amount
                                    });
                                    importedCount++;
                                }
                            }
                        });

                        alert(`成功导入 ${importedCount} 条记录`);
                        UI.renderStats();
                        UI.renderChart();
                        UI.renderTable();
                    } catch (error) {
                        alert('文件格式错误，无法解析');
                        console.error(error);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // 全局暴露函数
        window.deleteTransaction = App.deleteTransaction.bind(App);
        window.editTransaction = App.editTransaction.bind(App);
        window.updateCategoryOptions = UI.updateCategoryOptions.bind(UI);
        window.renderTable = UI.renderTable.bind(UI);

        // 启动应用
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
