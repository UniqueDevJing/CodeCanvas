server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: codecanvas
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      # 必须不小于 SSE 的超时时间，否则长生成会被容器提前掐断
      request-timeout: 1200000
  # P0-2 MCP Server：把确定性工具按 Model Context Protocol 标准对外发布。
  # 与 Spring AI 1.1.8 / Boot 3.5.16 对齐；2.0.x 需要 Boot 4，暂不采用。
  ai:
    mcp:
      server:
        enabled: ${CODECANVAS_MCP_ENABLED:true}
        name: codecanvas-tools
        version: 1.0.0
        # STREAMABLE = 现代 Streamable HTTP（端点 /mcp），langchain4j-mcp 客户端可直接消费。
        # starter 默认的 SSE 是旧协议，客户端侧没有对应 transport，所以这里必须显式切。
        protocol: STREAMABLE
        type: SYNC
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        instructions: CodeCanvas 确定性工具集：HTML 质检与工具契约发现。全部不依赖大模型，可重复调用。

codecanvas:
  storage:
    # 项目与版本快照的落盘位置
    dir: ./codecanvas-data
  mcp:
    client:
      # P0-2 MCP 客户端：外部 Server 的工具会注册进本次运行的 ToolRegistry，
      # 由 ReAct 自主循环按需调用。默认关闭；连接失败自动降级为空工具集，不影响主流程。
      enabled: ${CODECANVAS_MCP_CLIENT_ENABLED:false}
      url: ${CODECANVAS_MCP_CLIENT_URL:http://127.0.0.1:8080/mcp}
      timeout-ms: ${CODECANVAS_MCP_CLIENT_TIMEOUT:10000}
  llm:
    # auto=有密钥用真实模型，否则退回离线引擎；real=强制真实；mock=强制离线
    mode: ${CODECANVAS_LLM_MODE:auto}
  runtime-verify:
    # C1 执行级验证闭环：把生成的页面放进无头浏览器真跑一遍（加载/点按钮/断言/截图），
    # 失败信息结构化回注到自检修复闭环。无 Playwright 时自动降级为仅静态校验，不影响交付。
    enabled: ${CODECANVAS_RUNTIME_VERIFY_ENABLED:true}
    # Node 运行时命令（需能解析到 playwright）
    node-command: ${CODECANVAS_RUNTIME_VERIFY_NODE:node}
    # 验证脚本相对路径，找不到时会在工作目录逐级向上回退查找 tools/runtime-verify.mjs
    node-script: ${CODECANVAS_RUNTIME_VERIFY_SCRIPT:tools/runtime-verify.mjs}
    # 是否自动点一次主按钮并观察是否抛异常
    click-main-button: ${CODECANVAS_RUNTIME_VERIFY_CLICK:true}
    # 单次验证整体超时（毫秒），超时则降级为仅静态校验
    timeout-ms: ${CODECANVAS_RUNTIME_VERIFY_TIMEOUT:15000}
  acceptance:
    # C4 验收断言：从 PRD 自动生成 3 条断言作为"生成完成"的客观判据，
    # 未通过的断言并入自检修复闭环（回注 → 修复 → 重验）。
    enabled: ${CODECANVAS_ACCEPTANCE_ENABLED:true}
    # C-A 语义档：kind=semantic 的断言按"断言描述 vs 页面可见文本"嵌入相似度判定。
    # 默认关闭（未配置打分器时语义断言诚实降级为不纳入判据，绝不假装通过）。
    semantic-enabled: ${CODECANVAS_ACCEPTANCE_SEMANTIC:false}
    semantic-model: ${CODECANVAS_ACCEPTANCE_SEMANTIC_MODEL:text-embedding-v3}
  react:
    # C5 真 ReAct 分支：请求带 strategy=react 时走模型自主循环（自己决定调用什么工具），
    # 与固定流水线做 A/B 对照。三重终止：max-steps / 预算耗尽 / 校验通过。
    # 自主循环产不出页面时自动退回流水线兜底，不影响交付。
    max-steps: ${CODECANVAS_REACT_MAX_STEPS:10}
  budget:
    # C2 预算感知调度：把 TokenMeter 的事后计量升级为准入控制。
    # 每任务可经 AgentRunRequest.budget 下发三元预算；此处为"启用时的默认预算"（全 0 = 不预设，按请求下发）。
    enabled: ${CODECANVAS_BUDGET_ENABLED:true}
    default-max-cost-yuan: ${CODECANVAS_BUDGET_MAX_COST:0}
    default-max-latency-ms: ${CODECANVAS_BUDGET_MAX_LATENCY:0}
    default-max-tokens: ${CODECANVAS_BUDGET_MAX_TOKENS:0}
    # 无预算时仍允许的最大自检修复轮次（与改造前一致）
    max-heal-attempts: ${CODECANVAS_BUDGET_MAX_HEAL:3}
    # openai=OpenAI 兼容协议（DeepSeek / GLM / 通义 / 硅基流动等）；anthropic=Anthropic 协议
    active-provider: ${CODECANVAS_PROVIDER:openai}
    openai:
      # 默认指向阿里云百炼（DashScope）的 OpenAI 兼容端点；
      # 换 base-url 与模型名即可切到 DeepSeek / GLM / 硅基流动等其他兼容厂商
      base-url: ${CODECANVAS_OPENAI_BASE:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${CODECANVAS_OPENAI_KEY:}
      timeout-seconds: 180
    anthropic:
      base-url: ${CODECANVAS_ANTHROPIC_BASE:https://api.anthropic.com/v1}
      api-key: ${CODECANVAS_ANTHROPIC_KEY:}
      timeout-seconds: 180
    # 首字节超时：流式调用如果这么久还没吐出任何内容，就认为这家不通，立刻降级，
    # 不让用户在主模型上白等。实测 coder 系列通常 1~3 秒内开始输出。
    first-token-seconds: 45
    # 分级路由的目标模型：同一个请求按任务复杂度落到不同档位。
    #
    # ⚠️ 档位名（旗舰/标准/轻量）只是**路由标签**，不代表价格高低 ——
    # 亲测：这个系列里"旗舰"档的 coder-next 反而最便宜。别按名字猜贵贱。
    #
    # 选型依据（平台真实提示词 3 轮对照 + 官方价目表）：
    #   qwen3-coder-next   13.3s / 13899 字符  |  1 元输入 / 4 元输出（每百万）
    #   qwen3-coder-plus   14.3s /  6773 字符  |  4 元输入 / 16 元输出
    #   qwen3-coder-flash  秒级 / 量小          |  1 元输入 / 4 元输出
    # → coder-plus 被 coder-next **全面压制**（更贵、更慢、产出只有一半），已移出档位映射。
    #   标准档改由 coder-next 承担；flash 保留在轻量档，为的是小任务的延迟，不是省钱。
    models:
      flagship: ${CODECANVAS_MODEL_FLAGSHIP:qwen3-coder-next}
      standard: ${CODECANVAS_MODEL_STANDARD:qwen3-coder-next}
      light: ${CODECANVAS_MODEL_LIGHT:qwen3-coder-flash}
    # 单价（元/千 token = 元/百万 ÷ 1000）。
    # 来源：阿里云百炼「模型调用价格」页（docs.bailian.console.aliyun.com/zh/model-studio/model-pricing），
    # 取 coder 系列 **0<Token≤32K** 档；核对日期 2026-09-21。
    #
    # 已知简化：百炼对 coder 系列是**阶梯计价**（按单次请求输入 token 分档，非分段累进），
    # 本平台只记单一单价。当前请求都在 32K 以内，所以取该档；
    # 若将来出现超长输入，这里的估算会偏低，需要按档位分段计算。
    pricing:
      flagship-input: 0.001
      flagship-output: 0.004
      standard-input: 0.001
      standard-output: 0.004
      light-input: 0.001
      light-output: 0.004
      # 反事实基准单价（元/千 token）：回答"不做选型、按名字直觉挑一个会多花多少"。
      # 取改造前挂在标准档的 qwen3-coder-plus（4 / 16 元每百万）——那正是"没修正之前"的实际路径。
      # 它不是任何一档的实际价格，而是一个**显式声明的参照**，基准是谁会跟着台账一起返回。
      baseline-input: 0.004
      baseline-output: 0.016
      baseline-note: qwen3-coder-plus（改造前挂在标准档的模型）

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    com.codecanvas: INFO
